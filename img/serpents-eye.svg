<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-labelledby="eyeTitle eyeDesc">
  <title id="eyeTitle">Serpent's Eye</title>
  <desc id="eyeDesc">A serpent coiled three times around the sun, a horizontal slit pupil at the center. Line only. Never a cartoon snake, never a caduceus.</desc>
  <!-- Outer sun ring — the court of the coil -->
  <circle cx="100" cy="100" r="93" stroke="#C9A227" stroke-width="1.1"/>
  <!-- Inner sun — gold as light, not a fill -->
  <circle cx="100" cy="100" r="31" stroke="#E8C547" stroke-width="1.2"/>
  <!-- Coil 1 (outer) -->
  <path d="M100 16 A84 84 0 1 1 86 18.2" stroke="#C9A227" stroke-width="1.55" stroke-linecap="round"/>
  <!-- Coil 2 (middle) — a step inward -->
  <path d="M82 27.4 A66 66 0 1 0 100 34" stroke="#C9A227" stroke-width="1.45" stroke-linecap="round"/>
  <!-- Coil 3 (inner) -->
  <path d="M100 51 A49 49 0 1 1 87.6 52.6" stroke="#C9A227" stroke-width="1.35" stroke-linecap="round"/>
  <!-- Bridges between coils: the body stepping down the ziggurat of rings -->
  <path d="M86 18.2 C78 22 76 26 82 27.4" stroke="#C9A227" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M100 34 C100 42 100 46 100 51" stroke="#C9A227" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M87.6 52.6 C80 62 78 72 84 84" stroke="#C9A227" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Head at the outer beginning, a small almond, not a cartoon -->
  <path d="M100 16 C107 8 114 10 116 16 C114 22 107 24 100 16 Z" stroke="#E8C547" stroke-width="1.25" stroke-linejoin="round"/>
  <!-- Almond eye around the sun's heart -->
  <path d="M69 100 C86 83 114 83 131 100 C114 117 86 117 69 100 Z" stroke="#C9A227" stroke-width="1.45"/>
  <!-- Horizontal slit pupil -->
  <path d="M84 100 H116" stroke="#E8C547" stroke-width="2.35" stroke-linecap="round"/>
</svg>
